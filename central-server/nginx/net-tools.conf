# ==============================================================================
# Configuração de Proxy Reverso NGINX para UEPG Net Tools
# Arquivo: /etc/nginx/sites-available/net-tools.conf (ou conf.d/net-tools.conf)
# ==============================================================================

# 1. Redirecionamento HTTP para HTTPS (Opcional, caso use certificado SSL/TLS)
# server {
#     listen 80;
#     server_name net-tools.uepg.br 177.101.22.40;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2; # Descomente para HTTPS
    server_name net-tools.uepg.br 177.101.22.40;

    # Certificados SSL/TLS (se aplicável):
    # ssl_certificate /etc/ssl/certs/net-tools.crt;
    # ssl_certificate_key /etc/ssl/private/net-tools.key;

    # Tamanho máximo de upload (necessário para download e upload de instaladores e speedtests)
    client_max_body_size 100M;

    # Timeouts confortáveis para testes de Throughput e pings
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        # Repasse de cabeçalhos de identificação do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets e Server-Sent Events (SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Desativa buffering de resposta para telemetria em tempo real
        proxy_buffering off;
    }
}

services:
  # Servidor Central de Telemetria (Go 1.22)
  central-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-central-server
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-network_central}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-metrics}
      - API_TOKEN=${API_TOKEN:-super-secret-probe-token-2026}
      - STATIC_DIR=${STATIC_DIR:-/app/public}
      - QUERY_HOURS_LIMIT=${QUERY_HOURS_LIMIT:-24}
      - AUTH_ADMIN_USER=${AUTH_ADMIN_USER:-admin}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:-admin123}
      - AUTH_VIEWER_USER=${AUTH_VIEWER_USER:-operador}
      - AUTH_VIEWER_PASSWORD=${AUTH_VIEWER_PASSWORD:-operador123}
      - SESSION_SECRET=${SESSION_SECRET:-super-secret-session-key-change-in-prod-2026}
    volumes:
      - ./public:/app/public:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - monitoring-net

  # Banco de Dados MongoDB compatível com CPUs sem AVX (VMs e Hypervisors)
  mongo:
    image: mongo:4.4-focal
    container_name: network-mongo-timeseries
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Volume persistente no diretório local do host (evita perda de dados ao executar 'docker compose down' ou 'down -v')
      - ./mongo_data:/data/db
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge


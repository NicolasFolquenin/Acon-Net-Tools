services:
  # Servidor Central de Telemetria (Go 1.22)
  central-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-central-server
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:${PORT:-8085}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-network_central}
      - MONGO_COLLECTION=${MONGO_COLLECTION:-metrics}
      - API_TOKEN=${API_TOKEN:-super-secret-probe-token-2026}
      - STATIC_DIR=${STATIC_DIR:-/app/public}
      - QUERY_HOURS_LIMIT=${QUERY_HOURS_LIMIT:-24}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - monitoring-net

  # Banco de Dados MongoDB com suporte nativo a Time Series
  mongo:
    image: mongo:7.0-jammy
    container_name: network-mongo-timeseries
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring-net

volumes:
  mongo_data:
    driver: local

networks:
  monitoring-net:
    driver: bridge
